<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단백질 배달 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#0a0e0f; --panel:#121a1b; --border:#1f3330;
  --green:#39ff88; --green-dim:#1d7a4c; --cyan:#39e0ff;
  --amber:#ffcc33; --red:#ff4d5e;
  --text:#d8ffe8; --text-dim:#6f8f84;
  --shadow:4px 4px 0 #000;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  background-image:linear-gradient(rgba(57,255,136,.045) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(57,255,136,.045) 1px,transparent 1px);
  background-size:26px 26px;
}
.pixel{font-family:'Press Start 2P',monospace;}
button{font-family:inherit;}
button:focus-visible,.amino:focus-visible{outline:2px dashed var(--cyan);outline-offset:2px;}
.app{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:270px 1fr;gap:16px;}
.panel{background:var(--panel);border:3px solid var(--border);box-shadow:var(--shadow);padding:14px;}
.panel h2{font-size:12px;letter-spacing:.5px;color:var(--green);margin:0 0 10px;}
.right-col{display:flex;flex-direction:column;gap:16px;}

/* top bar */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.timer-track{flex:1;min-width:140px;height:18px;background:#000;border:2px solid var(--green);}
.timer-fill{height:100%;width:100%;background:var(--green);transition:width 1s linear,background .3s;}
.timer-fill.warn{background:var(--amber);}
.timer-fill.danger{background:var(--red);}
.stats{display:flex;gap:14px;font-size:11px;color:var(--text-dim);white-space:nowrap;}
.stats b{color:var(--cyan);font-weight:700;}
#livesDisplay{font-size:13px;letter-spacing:2px;}
#timeLabel{font-size:11px;color:var(--text-dim);min-width:44px;text-align:right;}

/* recipe panel */
.recipe-panel{max-height:78vh;overflow-y:auto;}
.recipe-panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.recipe-panel li{border-bottom:1px dashed var(--border);padding-bottom:8px;}
.o-name{display:block;color:var(--cyan);font-weight:700;font-size:14px;margin-bottom:5px;}
.seq i{font-style:normal;font-size:9px;background:#000;border:2px solid var(--green-dim);color:var(--green);padding:3px 5px;}
.arrow{color:var(--text-dim);margin:0 3px;font-size:10px;}

/* request panel */
.dialog-box{min-height:90px;padding:16px;border:3px solid var(--green);box-shadow:inset 0 0 0 3px var(--bg),0 0 0 3px var(--green-dim);font-size:15px;line-height:1.65;}
.cursor{display:inline-block;color:var(--green);animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* synth panel */
.synth-panel{transition:box-shadow .15s;}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.slot{width:54px;height:54px;border:3px solid var(--green-dim);background:#000;display:flex;align-items:center;justify-content:center;font-size:9px;}
.slot.filled{background:var(--green-dim);color:var(--bg);font-weight:700;box-shadow:0 0 8px var(--green);animation:popIn .22s ease-out;}
@keyframes popIn{0%{transform:scale(.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
.amino-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
.amino{font-size:10px;padding:12px 2px;background:var(--border);color:var(--text);border:3px solid var(--green-dim);box-shadow:3px 3px 0 #000;cursor:pointer;}
.amino:active{transform:translate(3px,3px);box-shadow:none;}
.btn-row{display:flex;gap:10px;}
.pixel-btn{flex:1;padding:14px;font-size:12px;border:3px solid #000;box-shadow:var(--shadow);cursor:pointer;}
.pixel-btn:active{transform:translate(4px,4px);box-shadow:none;}
.btn-clear{background:#2a2a2a;color:var(--text);}
.btn-deliver{background:var(--green);color:#042a16;font-weight:700;}

.synth-panel.pop-correct{animation:flashGreen .5s;}
@keyframes flashGreen{0%{box-shadow:0 0 0 6px var(--green),var(--shadow);}100%{box-shadow:var(--shadow);}}
.synth-panel.shake-wrong{animation:shakeRed .4s;}
@keyframes shakeRed{10%,90%{transform:translateX(-4px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}100%{transform:translateX(0);}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.overlay.hidden{display:none;}
.overlay-box{background:var(--panel);border:4px solid var(--green);box-shadow:6px 6px 0 #000;padding:30px 26px;max-width:420px;text-align:center;}
.overlay-box h2{font-size:16px;color:var(--green);margin:0 0 14px;}
.overlay-box p{font-size:13px;line-height:1.7;color:var(--text-dim);margin:0 0 20px;}
.overlay-box button{width:100%;}

@media (max-width:820px){
  .app{grid-template-columns:1fr;}
  .recipe-panel{order:2;max-height:220px;}
  .right-col{order:1;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel recipe-panel">
    <h2 class="pixel">📜 신호 서열 설계도</h2>
    <ul id="recipeList"></ul>
  </aside>

  <section class="right-col">
    <div class="panel topbar">
      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
      <span id="timeLabel" class="pixel">1:30</span>
      <div class="stats pixel">
        <span>STAGE <b id="stageNum">1</b></span>
        <span>SCORE <b id="scoreNum">0</b></span>
        <span>연속 <b id="streakNum">0</b>/<b id="streakReq">1</b></span>
        <span>목숨 <b id="livesDisplay"></b></span>
      </div>
    </div>

    <div class="panel request-panel">
      <h2 class="pixel">📨 의뢰 도착</h2>
      <div class="dialog-box"><span id="requestText"></span><span class="cursor">▋</span></div>
    </div>

    <div class="panel synth-panel">
      <h2 class="pixel">🧪 합성기</h2>
      <div class="slots" id="slots"></div>
      <div class="amino-grid" id="aminoGrid"></div>
      <div class="btn-row">
        <button id="clearBtn" class="pixel-btn btn-clear pixel">지우기</button>
        <button id="deliverBtn" class="pixel-btn btn-deliver pixel">🚀 배달</button>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlayTitle" class="pixel"></h2>
    <p id="overlayMsg"></p>
    <button id="overlayBtn" class="pixel-btn btn-deliver pixel"></button>
  </div>
</div>

<script>
const ORGANELLES = [
 {id:'membrane',name:'세포막',features:['세포를 둘러싸고 있으며, 세포 바깥 환경과 세포 내부 사이의 물질 출입을 조절하는 역할을 합니다.'],seq:['Val','Thr','Met']},
 {id:'nucleus',name:'핵',features:['세포에서 가장 크고 뚜렷하게 관찰되는 구형 기관으로, 유전정보를 통해 세포의 생명활동을 조절하고 구조와 기능을 결정합니다.','외막과 내막의 이중막 구조로 둘러싸여 있으며, 막 곳곳에 뚫린 작은 구멍들을 통해 세포질과 물질을 교환합니다.','내부에는 rRNA를 합성하는 인이 있으며, 유전물질인 DNA가 히스톤 단백질과 결합해 형성된 염색질이 들어 있습니다.'],seq:['Lys','Lys','Arg','Lys']},
 {id:'er',name:'소포체',features:['단일막 구조의 납작한 주머니와 관이 복잡하게 연결되어 세포 내 물질 수송의 통로 역할을 수행합니다.','표면에 라이보솜이 붙어 있어 단백질을 가공하고 골지체로 운반하는 거친면 유형과, 라이보솜이 없어 지질 및 스테로이드 합성, 해독 작용, 칼슘 이온 저장을 담당하는 매끈면 유형으로 구분됩니다.'],seq:['Met','Leu','Leu','Leu']},
 {id:'golgi',name:'골지체',features:['납작한 주머니 모양인 시스터나가 층층이 쌓여 있는 단일막 구조의 세포소기관입니다.','소포체에서 전달된 단백질과 지질을 가공한 뒤 운반 소낭으로 감싸 세포 밖으로 분비하거나 세포 내 다른 곳으로 수송합니다.'],seq:['Leu','Tyr','Ser','Met']},
 {id:'ribo',name:'라이보솜',features:['막으로 둘러싸여 있지 않은 알갱이 형태의 기관으로, 크기가 서로 다른 대단위체와 소단위체 등 2개의 단위체로 구성됩니다.','인에서 합성된 rRNA와 단백질로 이루어져 있으며, 유전정보에 맞춰 생명활동에 필요한 단백질을 합성합니다.'],seq:['Phe','Val','Lys']},
 {id:'lyso',name:'라이소좀',features:['골지체의 일부가 떨어져 나와 형성된 단일막 주머니입니다.','내부에 탄수화물, 단백질, 지질 등을 분해하는 다양한 가수분해효소가 들어 있어 이물질, 손상된 세포소기관, 노폐물을 분해하는 세포내소화 작용을 합니다.'],seq:['Tyr','X','X','Phe']},
 {id:'mito',name:'마이토콘드리아',features:['유기물을 분해하여 세포 생명활동에 필요한 ATP 에너지를 생성하는 세포호흡을 담당합니다.','외막과 내막의 이중막으로 이루어져 있으며, 내막은 안쪽으로 주름진 크리스타 구조를 형성하고 내막과 바탕질에는 세포호흡 효소와 전자전달계가 존재합니다.','자체적인 DNA와 라이보솜을 가지고 있어 세포 내에서 스스로 복제하여 증식할 수 있습니다.'],seq:['Arg','Leu','Lys','Phe']},
 {id:'chloro',name:'엽록체',features:['식물 세포에만 존재하는 초록색 이중막 소기관으로, 빛에너지를 포도당 같은 유기물의 화학 에너지로 전환하는 광합성을 수행합니다.','엽록소 등의 광합성색소와 전자전달계가 위치한 납작한 주머니(타이라코이드)가 쌓여 그라나를 이루며, 포도당 합성 효소가 있는 안쪽 공간은 스트로마라고 부릅니다.','마이토콘드리아와 마찬가지로 자체 DNA와 라이보솜이 있어 스스로 증식이 가능합니다.'],seq:['Ser','Thr','Ser','Val']},
 {id:'vacuole',name:'액포',features:['단일막으로 둘러싸여 있으며, 특히 성숙한 식물 세포에서 크게 발달하는 주머니입니다.','물을 흡수하여 세포 내 수분량과 삼투압을 조절하고, 유기물, 노폐물, 수용성 색소 등을 저장하며 형태 유지에 기여합니다.'],seq:['Thr','X','Val','Ser']},
 {id:'wall',name:'세포벽',features:['식물 세포의 세포막 바깥쪽을 감싸는 두껍고 단단한 구조물로 세포를 보호하고 형태를 유지합니다.','셀룰로스로 구성된 1차 구조가 기본이며, 식물이 성숙함에 따라 1차 구조와 세포막 사이에 더 두꺼운 2차 구조가 형성되기도 합니다.'],seq:['X','Thr','Thr']},
 {id:'centriole',name:'중심체',features:['주로 동물 세포에 존재하며, 직각으로 배열된 2개의 중심립으로 이루어져 세포 분열 시 방추사 형성에 관여합니다.','각각의 중심립은 미세소관 다발로 구성되어 있습니다.'],seq:['Lys','Val','X','Lys']},
 {id:'cytoskel',name:'세포골격',features:['세포 내에 단백질 섬유가 그물처럼 얽혀 형태를 결정하는 뼈대 역할을 하며, 세포소기관의 위치를 고정하거나 이동시킵니다.','굵기에 따라 방추사나 중심체를 구성하는 가장 굵은 미세소관, 세포 형태를 유지하는 중간섬유, 세포막을 지탱하는 가장 가는 미세섬유로 나뉩니다.'],seq:['Ser','Leu','X']},
];
const AMINO = ['Arg','Leu','Lys','Phe','Ser','Thr','Val','Met','Tyr','X'];
const STAGE_TIME = 90, MAX_STAGE = 3, WRONG_PENALTY = 30, MAX_LIVES = 3;

const el = id => document.getElementById(id);
const recipeList=el('recipeList'), slotsEl=el('slots'), aminoGrid=el('aminoGrid'),
      requestText=el('requestText'), timerFill=el('timerFill'), timeLabel=el('timeLabel'),
      stageNum=el('stageNum'), scoreNum=el('scoreNum'), streakNum=el('streakNum'), streakReq=el('streakReq'),
      livesDisplay=el('livesDisplay'),
      overlay=el('overlay'), overlayTitle=el('overlayTitle'), overlayMsg=el('overlayMsg'), overlayBtn=el('overlayBtn'),
      synthPanel=document.querySelector('.synth-panel');

let state={stage:1,score:0,streak:0,required:1,lives:MAX_LIVES,timeLeft:STAGE_TIME,timerId:null,current:null,selected:[],prevId:null,playing:false};
let typeTimer=null;

recipeList.innerHTML = ORGANELLES.map(o=>
 `<li><span class="o-name">${o.name}</span><span class="seq">${o.seq.map(a=>`<i>${a}</i>`).join('<span class="arrow">→</span>')}</span></li>`
).join('');

aminoGrid.innerHTML = AMINO.map(a=>`<button class="amino pixel" data-a="${a}">${a}</button>`).join('');
aminoGrid.addEventListener('click', e=>{
  const b = e.target.closest('.amino'); if(!b) return;
  onAminoClick(b.dataset.a);
});
el('clearBtn').addEventListener('click', onClear);
el('deliverBtn').addEventListener('click', onDeliver);

function fmt(s){ s=Math.max(0,s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function pickOrganelle(){
  const pool = ORGANELLES.filter(o=>o.id!==state.prevId);
  const o = pool[Math.floor(Math.random()*pool.length)];
  state.prevId = o.id; return o;
}

function typeText(text){
  clearInterval(typeTimer);
  requestText.textContent=''; let i=0;
  typeTimer=setInterval(()=>{
    requestText.textContent += text[i]; i++;
    if(i>=text.length) clearInterval(typeTimer);
  },18);
}

function renderSlots(){
  slotsEl.innerHTML='';
  const len = state.current.seq.length;
  for(let i=0;i<len;i++){
    const d=document.createElement('div');
    d.className='slot'+(state.selected[i]?' filled':'');
    d.textContent = state.selected[i]||'';
    slotsEl.appendChild(d);
  }
}

function newQuestion(){
  state.current = pickOrganelle();
  state.selected = [];
  renderSlots();
  const feats = state.current.features;
  const feature = feats[Math.floor(Math.random()*feats.length)];
  typeText(feature);
}

function onAminoClick(a){
  if(!state.playing) return;
  if(state.selected.length >= state.current.seq.length) return;
  state.selected.push(a);
  renderSlots();
}
function onClear(){ if(!state.playing) return; state.selected=[]; renderSlots(); }

function flash(ok){
  synthPanel.classList.remove('pop-correct','shake-wrong');
  void synthPanel.offsetWidth;
  synthPanel.classList.add(ok?'pop-correct':'shake-wrong');
}

function onDeliver(){
  if(!state.playing) return;
  const seq = state.current.seq;
  const correct = state.selected.length===seq.length && state.selected.every((a,i)=>a===seq[i]);
  if(correct){
    state.score += 100; state.streak += 1; updateStats(); flash(true);
    if(state.streak >= state.required){
      clearInterval(state.timerId);
      setTimeout(stageClear, 500);
    }else{
      setTimeout(newQuestion, 550);
    }
  }else{
    state.timeLeft = Math.max(0, state.timeLeft - WRONG_PENALTY);
    updateTimerUI(); flash(false);
    state.selected=[]; setTimeout(renderSlots,300);
  }
}

function updateStats(){
  stageNum.textContent=state.stage; scoreNum.textContent=state.score;
  streakNum.textContent=state.streak; streakReq.textContent=state.required;
}
function updateLivesUI(){
  const n = Math.max(0,state.lives);
  livesDisplay.textContent = '❤️'.repeat(n) + '🖤'.repeat(MAX_LIVES-n);
}
function updateTimerUI(){
  const pct = Math.max(0, state.timeLeft/STAGE_TIME*100);
  timerFill.style.width = pct+'%';
  timerFill.classList.toggle('warn', state.timeLeft<=30 && state.timeLeft>10);
  timerFill.classList.toggle('danger', state.timeLeft<=10);
  timeLabel.textContent = fmt(state.timeLeft);
}
function tick(){
  state.timeLeft -= 1; updateTimerUI();
  if(state.timeLeft<=0){ clearInterval(state.timerId); loseLife(); }
}

function loseLife(){
  state.playing=false;
  state.lives -= 1; updateLivesUI();
  if(state.lives<=0){ gameOver(); return; }
  showOverlay('TIME OVER! 목숨 -1',
    '남은 목숨 '+state.lives+'개. 제한시간이 1분 30초로 초기화되고 같은 스테이지를 계속 진행합니다.',
    '계속하기', ()=>{
      state.timeLeft=STAGE_TIME; state.streak=0; state.playing=true;
      updateStats(); updateTimerUI(); newQuestion();
      clearInterval(state.timerId); state.timerId=setInterval(tick,1000);
      hideOverlay();
    });
}

function startStage(n){
  state.stage=n; state.required=n; state.streak=0; state.timeLeft=STAGE_TIME; state.playing=true;
  updateStats(); updateTimerUI(); updateLivesUI(); newQuestion();
  clearInterval(state.timerId);
  state.timerId=setInterval(tick,1000);
  hideOverlay();
}
function stageClear(){
  state.playing=false;
  if(state.stage>=MAX_STAGE){ gameComplete(); return; }
  showOverlay('STAGE '+state.stage+' CLEAR!',
    '다음 스테이지는 연속 '+(state.stage+1)+'회 정답이 필요해요. 제한시간은 1분 30초로 초기화됩니다.',
    '다음 스테이지', ()=>startStage(state.stage+1));
}
function gameOver(){
  state.playing=false; clearInterval(state.timerId);
  showOverlay('GAME OVER','목숨을 모두 잃었습니다! 도달 스테이지 '+state.stage+' · 최종 점수 '+state.score,
    '다시 도전', ()=>{ state.score=0; state.lives=MAX_LIVES; updateLivesUI(); startStage(1); });
}
function gameComplete(){
  state.playing=false; clearInterval(state.timerId);
  showOverlay('ALL CLEAR! 🏆','모든 세포소기관에 단백질을 무사히 배달했습니다! 최종 점수 '+state.score,
    '다시 플레이', ()=>{ state.score=0; state.lives=MAX_LIVES; updateLivesUI(); startStage(1); });
}
function showOverlay(title,msg,btnLabel,onClick){
  overlayTitle.textContent=title; overlayMsg.textContent=msg; overlayBtn.textContent=btnLabel;
  overlayBtn.onclick=onClick; overlay.classList.remove('hidden');
}
function hideOverlay(){ overlay.classList.add('hidden'); }

updateStats(); updateLivesUI(); updateTimerUI();
showOverlay('단백질 배달 게임','세포소기관의 특징을 읽고 설계도를 참고해 올바른 아미노산 신호 서열을 조립한 뒤 배달하세요! 목숨은 3개, 시간이 다 되면 목숨이 1개 줄고 오답은 30초가 차감됩니다.',
  '게임 시작', ()=>startStage(1));
</script>
